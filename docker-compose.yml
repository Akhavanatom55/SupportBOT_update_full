version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: supportbot_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supportbot_next
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/app_db
      - BALE_BOT_TOKEN=${BALE_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_IDS=${ADMIN_IDS}
    depends_on:
      - postgres

volumes:
  pgdata:
